# Data
data_dir: ./data/speech_commands_v0.02
# Model
model_name: baseline_cnn
num_classes: 12
# Training
epochs: 30
batch_size: 128
lr: 0.001
weight_decay: 0.01
label_smoothing: 0.0
# Features
sample_rate: 16000
n_fft: 480
hop_length: 160
n_mels: 40
# Augmentation
augment: true
noise_prob: 0.8
time_shift_ms: 100
spec_augment: true
freq_mask_param: 7
time_mask_param: 20
# System
device: auto
num_workers: 4
seed: 42
